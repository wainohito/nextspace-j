# Install as /etc/systemd/system.conf.d/nextspace-timeout.conf and
# /etc/systemd/user.conf.d/nextspace-timeout.conf
# Wait at most 15 s (default 90 s) for a service or session to stop before
# killing it.  mozc_server in the login session ignores SIGTERM, so every
# shutdown otherwise waited the full 1 min 30 s.
[Manager]
DefaultTimeoutStopSec=15s
